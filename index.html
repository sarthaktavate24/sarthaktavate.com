<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.42/bundled/lenis.min.js"></script>

<style>
/* ============================================================
   RESET + ROOT
============================================================ */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body, h1, h2, h3, h4, p, ul { margin: 0; }

:root {
	--bg: #0a0a0c;
	--bg-2: #111114;
	--bg-3: #17171c;
	--surface: #1c1c22;
	--text: #f4f4f5;
	--text-dim: #a1a1aa;
	--text-mute: #6b6b73;
	--accent: #ff5c37;
	--accent-glow: rgba(255, 92, 55, 0.35);
	--border: rgba(255,255,255,0.08);
	--border-strong: rgba(255,255,255,0.18);
	--radius-sm: 12px;
	--radius-md: 20px;
	--radius-lg: 32px;
	--ease: cubic-bezier(0.6, 0.05, 0.2, 1);
}

html { scroll-behavior: smooth; }
html.lenis { height: auto; }
.lenis.lenis-smooth { scroll-behavior: auto !important; }
.lenis.lenis-smooth [data-lenis-prevent] { overscroll-behavior: contain; }
.lenis.lenis-stopped { overflow: hidden; }

body {
	background: var(--bg);
	color: var(--text);
	font-family: 'Inter', 'Fira Sans', sans-serif;
	font-size: 16px;
	line-height: 1.55;
	-webkit-font-smoothing: antialiased;
	overflow-x: hidden;
	cursor: none;
}

a { color: var(--accent); text-decoration: none; }
img { display: block; max-width: 100%; height: auto; }

/* ============================================================
   AMBIENT BACKGROUND
============================================================ */
.page-container {
	position: relative;
	background: var(--bg);
	overflow: hidden;
}
.page-container::before {
	content: "";
	position: fixed;
	inset: 0;
	background:
		radial-gradient(800px 600px at 15% 10%, rgba(255,92,55,0.12), transparent 60%),
		radial-gradient(700px 500px at 85% 80%, rgba(120,80,255,0.08), transparent 60%),
		linear-gradient(180deg, #0a0a0c 0%, #0d0d10 100%);
	z-index: 0;
	pointer-events: none;
}
.page-container::after {
	content: "";
	position: fixed;
	inset: 0;
	background-image: url("images/2_BG_electronics.png");
	background-position: center;
	background-repeat: no-repeat;
	background-size: cover;
	opacity: 0.05;
	mix-blend-mode: screen;
	z-index: 0;
	pointer-events: none;
}
.row { position: relative; z-index: 1; }

/* ============================================================
   CUSTOM CURSOR
============================================================ */
.cursor-dot, .cursor-ring {
	position: fixed;
	top: 0; left: 0;
	pointer-events: none;
	z-index: 99999;
	transform: translate3d(-50%, -50%, 0);
	mix-blend-mode: difference;
}
.cursor-dot {
	width: 6px; height: 6px;
	background: #fff;
	border-radius: 50%;
	transition: width 0.25s var(--ease), height 0.25s var(--ease), background 0.25s;
}
.cursor-ring {
	width: 36px; height: 36px;
	border: 1.5px solid rgba(255,255,255,0.6);
	border-radius: 50%;
	transition: width 0.3s var(--ease), height 0.3s var(--ease), border-color 0.3s, background 0.3s;
}
.cursor-hover .cursor-dot { width: 0; height: 0; }
.cursor-hover .cursor-ring {
	width: 60px; height: 60px;
	border-color: var(--accent);
	background: rgba(255,92,55,0.12);
}
@media (max-width: 900px), (hover: none) {
	body { cursor: auto; }
	.cursor-dot, .cursor-ring { display: none; }
}

/* ============================================================
   HEADER (row-1)
============================================================ */
.page-container > .row-1 {
	position: fixed;
	top: 16px;
	left: 50%;
	transform: translateX(-50%);
	width: calc(100% - 40px);
	max-width: 1320px;
	z-index: 9999;
	padding: 0;
	transition: top 0.4s var(--ease), transform 0.4s var(--ease);
}
.row-1 .row-content {
	display: flex;
	max-width: 100%;
	margin: 0;
	padding: 14px 22px;
	align-items: center;
	justify-content: space-between;
	background: rgba(15, 15, 18, 0.55);
	backdrop-filter: blur(24px) saturate(150%);
	-webkit-backdrop-filter: blur(24px) saturate(150%);
	border: 1px solid var(--border);
	border-radius: 100px;
	box-shadow: 0 10px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.06);
	transition: padding 0.4s var(--ease), background 0.4s var(--ease);
}
.page-container > .row-1.scrolled .row-content {
	padding: 8px 18px;
	background: rgba(15, 15, 18, 0.78);
}

.row-1 .col-1, .row-1 .col-2 { padding: 0; }
.row-1 .col-1 { flex: 0 0 auto; }
.row-1 .col-2 { flex: 1 1 auto; display: flex; justify-content: flex-end; }

.row-1 .block-1.spacer, .row-1 .col-2 .block-1 { display: none; }

.row-1 .col-1 .block-2 { width: auto; }
.row-1 .col-1 .block-2 a { display: inline-flex; align-items: center; }
.row-1 .col-1 .block-2 img {
	max-width: 46px !important;
	height: auto;
	filter: brightness(0) invert(1);
	transition: transform 0.4s var(--ease), filter 0.4s var(--ease);
}
.row-1 .col-1 .block-2 a:hover img {
	transform: rotate(8deg) scale(1.08);
	filter: brightness(0) saturate(100%) invert(45%) sepia(85%) saturate(2200%) hue-rotate(345deg) brightness(101%) contrast(101%);
}

.row-1 nav.menu ul {
	display: flex;
	align-items: center;
	gap: 4px;
	list-style: none;
	padding: 0;
	margin: 0;
}
.row-1 nav.menu ul li { display: inline-block; }
.row-1 nav.menu ul li a {
	display: inline-block;
	padding: 9px 18px;
	font-family: 'Inter', sans-serif;
	font-size: 13.5px;
	font-weight: 500;
	letter-spacing: 0.02em;
	color: var(--text-dim);
	background: transparent;
	border-radius: 100px;
	border: 1px solid transparent;
	transition: color 0.3s, background 0.3s, border-color 0.3s, transform 0.3s var(--ease);
}
.row-1 nav.menu ul li a:hover {
	color: var(--text);
	background: rgba(255,255,255,0.06);
	border-color: var(--border);
	transform: translateY(-1px);
}
.row-1 nav.menu ul li:first-child a {
	color: var(--text);
	background: rgba(255,92,55,0.12);
	border-color: rgba(255,92,55,0.3);
}
.row-1 nav.menu ul li:last-child a {
	color: var(--text);
	background: var(--accent);
	border-color: var(--accent);
}
.row-1 nav.menu ul li:last-child a:hover {
	background: #ff7654;
	border-color: #ff7654;
	box-shadow: 0 6px 20px var(--accent-glow);
}
.row-1 nav.menu ul span { display: none; }

/* ============================================================
   HERO (row-2)
============================================================ */
.row-2 {
	min-height: 100vh;
	display: flex;
	align-items: center;
	justify-content: center;
	padding: 140px 24px 80px;
	position: relative;
	overflow: hidden;
}
.row-2 .row-content {
	max-width: 1320px;
	width: 100%;
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 40px;
	background: transparent;
}
.row-2 .col-1, .row-2 .col-1 .block-1 { padding: 0; width: 100%; }

.hero-eyebrow {
	display: inline-flex;
	align-items: center;
	gap: 10px;
	padding: 8px 16px;
	font-family: 'JetBrains Mono', monospace;
	font-size: 11px;
	letter-spacing: 0.2em;
	text-transform: uppercase;
	color: var(--text-dim);
	background: rgba(255,255,255,0.04);
	border: 1px solid var(--border);
	border-radius: 100px;
}
.hero-eyebrow::before {
	content: "";
	width: 6px; height: 6px;
	background: var(--accent);
	border-radius: 50%;
	box-shadow: 0 0 12px var(--accent);
	animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
	0%, 100% { opacity: 1; transform: scale(1); }
	50% { opacity: 0.6; transform: scale(0.85); }
}

.hero-title {
	font-family: 'Space Grotesk', sans-serif;
	font-size: clamp(48px, 9vw, 140px);
	font-weight: 500;
	line-height: 0.95;
	letter-spacing: -0.04em;
	text-align: center;
	color: var(--text);
	max-width: 1100px;
}
.hero-title .accent { color: var(--accent); font-style: italic; font-weight: 400; }
.hero-title .line { display: block; overflow: hidden; }
.hero-title .line span { display: inline-block; }

.hero-sub {
	font-size: 17px;
	color: var(--text-dim);
	max-width: 580px;
	text-align: center;
	line-height: 1.6;
}

.row-2 .col-1 .block-1 {
	position: relative;
	width: 100%;
	max-width: 1100px;
	margin: 0 auto;
	border-radius: var(--radius-lg);
	overflow: hidden;
	border: 1px solid var(--border);
	box-shadow: 0 30px 80px rgba(0,0,0,0.5);
	will-change: transform;
}
.row-2 .col-1 .block-1 img {
	width: 100%;
	max-width: 100% !important;
	display: block;
}

.hero-scroll-cue {
	position: absolute;
	bottom: 24px;
	left: 50%;
	transform: translateX(-50%);
	font-family: 'JetBrains Mono', monospace;
	font-size: 10px;
	letter-spacing: 0.25em;
	text-transform: uppercase;
	color: var(--text-mute);
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 12px;
}
.hero-scroll-cue::after {
	content: "";
	width: 1px;
	height: 40px;
	background: linear-gradient(to bottom, var(--text-mute), transparent);
	animation: scrollCue 2s ease-in-out infinite;
}
@keyframes scrollCue {
	0% { transform: scaleY(0); transform-origin: top; }
	50% { transform: scaleY(1); transform-origin: top; }
	51% { transform-origin: bottom; }
	100% { transform: scaleY(0); transform-origin: bottom; }
}

/* ============================================================
   MARQUEE / STRIP (row-3)
============================================================ */
.row-3 {
	background: var(--bg);
	padding: 60px 0;
	border-top: 1px solid var(--border);
	border-bottom: 1px solid var(--border);
	overflow: hidden;
}
.row-3 .row-content {
	max-width: 100%;
	padding: 0;
	background: transparent;
}
.row-3 .col-1, .row-3 .col-1 .block-1 { padding: 0; width: 100%; }
.row-3 .col-1 .block-1 img {
	max-width: 720px !important;
	margin: 0 auto;
	opacity: 0.85;
	filter: brightness(1.1);
}

/* ============================================================
   SECTION INTRO (row-4)
============================================================ */
.row-4 {
	background: var(--bg);
	padding: 100px 24px 40px;
}
.row-4 .row-content {
	max-width: 1320px;
	flex-direction: column;
	gap: 40px;
	background: transparent;
}
.row-4 .col-1, .row-4 .col-1 .block-1 { padding: 0; width: 100%; }
.row-4 .col-1 .block-1 {
	max-width: 960px;
	margin: 0 auto;
	border-radius: var(--radius-md);
	overflow: hidden;
	border: 1px solid var(--border);
}
.row-4 .col-1 .block-1 img { width: 100%; max-width: 100% !important; }

/* Section heading helper before portfolio */
.section-header {
	max-width: 1320px;
	margin: 80px auto 40px;
	padding: 0 32px;
	display: flex;
	align-items: flex-end;
	justify-content: space-between;
	gap: 40px;
}
.section-header .label {
	font-family: 'JetBrains Mono', monospace;
	font-size: 11px;
	letter-spacing: 0.25em;
	text-transform: uppercase;
	color: var(--accent);
}
.section-header h2 {
	font-family: 'Space Grotesk', sans-serif;
	font-size: clamp(36px, 5vw, 64px);
	font-weight: 500;
	letter-spacing: -0.03em;
	line-height: 1;
	color: var(--text);
}
.section-header .meta {
	font-family: 'JetBrains Mono', monospace;
	font-size: 12px;
	color: var(--text-mute);
}

/* ============================================================
   PORTFOLIO GRID (row-5)
============================================================ */
.row-5 {
	background: var(--bg);
	padding: 20px 0 100px;
}
.row-5 .row-content {
	max-width: 1320px;
	padding: 0 32px !important;
	display: grid !important;
	grid-template-columns: repeat(3, 1fr);
	grid-auto-rows: 1fr;
	gap: 24px;
	background: transparent;
}
.row-5 .col-1, .row-5 .col-2, .row-5 .col-3, .row-5 .col-4 { display: contents; }

.row-5 .block-2.spacer { display: none; }

.row-5 .image {
	position: relative;
	width: 100%;
	aspect-ratio: 4 / 5;
	border-radius: var(--radius-md);
	overflow: hidden;
	background: var(--bg-3);
	border: 1px solid var(--border);
	transition: transform 0.5s var(--ease), border-color 0.4s, box-shadow 0.5s var(--ease);
}
.row-5 .image a {
	display: block;
	width: 100%;
	height: 100%;
	position: relative;
}
.row-5 .image img {
	width: 100% !important;
	max-width: 100% !important;
	height: 100% !important;
	object-fit: cover;
	border-radius: 0 !important;
	border: none !important;
	transition: transform 0.7s var(--ease), filter 0.5s;
}
.row-5 .image::after {
	content: attr(data-title);
	position: absolute;
	left: 20px;
	bottom: 18px;
	font-family: 'Space Grotesk', sans-serif;
	font-size: 22px;
	font-weight: 500;
	letter-spacing: -0.01em;
	color: var(--text);
	opacity: 0;
	transform: translateY(8px);
	transition: opacity 0.4s var(--ease), transform 0.4s var(--ease);
	z-index: 3;
	pointer-events: none;
}
.row-5 .image::before {
	content: "";
	position: absolute;
	inset: 0;
	background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.1) 35%, transparent 60%);
	opacity: 0;
	transition: opacity 0.4s var(--ease);
	z-index: 2;
	pointer-events: none;
}
.row-5 .image:hover {
	transform: translateY(-6px);
	border-color: var(--accent);
	box-shadow: 0 30px 60px rgba(0,0,0,0.5), 0 0 0 1px var(--accent), 0 0 60px var(--accent-glow);
}
.row-5 .image:hover img {
	transform: scale(1.06);
	filter: brightness(0.92);
}
.row-5 .image:hover::before, .row-5 .image:hover::after {
	opacity: 1;
	transform: translateY(0);
}

/* Arrow badge */
.row-5 .image a::after {
	content: "↗";
	position: absolute;
	top: 16px;
	right: 16px;
	width: 38px;
	height: 38px;
	display: flex;
	align-items: center;
	justify-content: center;
	font-size: 16px;
	color: var(--text);
	background: rgba(20,20,24,0.7);
	backdrop-filter: blur(10px);
	border: 1px solid var(--border-strong);
	border-radius: 50%;
	opacity: 0;
	transform: translate(6px, -6px) scale(0.85);
	transition: opacity 0.4s var(--ease), transform 0.4s var(--ease), background 0.3s;
	z-index: 3;
}
.row-5 .image:hover a::after {
	opacity: 1;
	transform: translate(0,0) scale(1);
	background: var(--accent);
	border-color: var(--accent);
}

/* Override legacy hover rules */
.row-5 .col-1 .block-1 a:hover img,
.row-5 .col-2 .block-1 a:hover img,
.row-5 .col-2 .block-3 a:hover img,
.row-5 .col-3 .block-1 a:hover img,
.row-5 .col-4 .block-1 a:hover img,
.row-5 .col-4 .block-3 a:hover img {
	transform: scale(1.06);
	border: none;
	border-radius: 0;
}

/* ============================================================
   CTA BLOCKS (row-6 & row-9)
============================================================ */
.row-6, .row-9 {
	padding: 60px 24px;
	background: var(--bg);
}
.row-6 .row-content, .row-9 .row-content {
	max-width: 1320px;
	background: linear-gradient(135deg, #1a1a20 0%, #0f0f12 100%);
	border: 1px solid var(--border);
	border-radius: var(--radius-lg);
	padding: 70px 60px;
	position: relative;
	overflow: hidden;
	gap: 40px;
	align-items: center;
	background-image: none !important;
}
.row-6 .row-content::before, .row-9 .row-content::before {
	content: "";
	position: absolute;
	top: -50%;
	right: -10%;
	width: 600px;
	height: 600px;
	background: radial-gradient(circle, var(--accent-glow), transparent 60%);
	opacity: 0.4;
	pointer-events: none;
}

.row-6 .col-1, .row-9 .col-1 { padding: 0; flex: 1 1 55%; }
.row-6 .col-2, .row-9 .col-2 { display: none; }
.row-6 .col-3, .row-9 .col-3 {
	padding: 0;
	flex: 1 1 35%;
	display: flex;
	flex-direction: column;
	gap: 24px;
	justify-content: center;
	align-items: flex-start;
}

.row-6 .col-1 .block-1, .row-9 .col-1 .block-1 { padding: 0; }
.row-6 .col-1 .block-1 h1, .row-9 .col-1 .block-1 h1 {
	font-family: 'Space Grotesk', sans-serif;
	font-size: clamp(34px, 4.5vw, 56px) !important;
	font-weight: 500;
	line-height: 1.05;
	letter-spacing: -0.03em;
	color: var(--text);
	text-align: left;
}
.row-6 .col-1 .block-1 h1 a, .row-9 .col-1 .block-1 h1 a {
	color: var(--accent) !important;
	font-style: italic;
	font-weight: 400;
	position: relative;
}
.row-6 .col-1 .block-1 h1 a::after, .row-9 .col-1 .block-1 h1 a::after {
	content: "";
	position: absolute;
	left: 0; bottom: 0.05em;
	width: 100%;
	height: 1px;
	background: var(--accent);
	opacity: 0.4;
}

.row-6 .col-3 .block-1, .row-9 .col-3 .block-1 {
	padding: 0;
	font-family: 'Inter', sans-serif;
	font-size: 16px;
	font-weight: 400;
	line-height: 1.6;
	color: var(--text-dim);
}
.row-6 .col-3 .block-2, .row-9 .col-3 .block-2 { padding: 0; }

.row-6 .col-3 .block-2 a, .row-9 .col-3 .block-2 a,
.row-11 .col-1 .block-4 a {
	display: inline-flex;
	align-items: center;
	gap: 10px;
	padding: 14px 28px !important;
	background: var(--accent) !important;
	color: var(--text) !important;
	border: 1px solid var(--accent) !important;
	border-radius: 100px !important;
	font-family: 'Inter', sans-serif !important;
	font-size: 14px !important;
	font-weight: 500 !important;
	letter-spacing: 0.01em;
	line-height: 1 !important;
	transition: transform 0.4s var(--ease), box-shadow 0.4s var(--ease), background 0.3s !important;
}
.row-6 .col-3 .block-2 a:hover, .row-9 .col-3 .block-2 a:hover,
.row-11 .col-1 .block-4 a:hover {
	background: #ff7654 !important;
	border-color: #ff7654 !important;
	color: var(--text) !important;
	transform: translateY(-3px);
	box-shadow: 0 14px 30px var(--accent-glow);
}
.row-6 .col-3 .block-2 a span, .row-9 .col-3 .block-2 a span,
.row-11 .col-1 .block-4 a span {
	font-size: 14px !important;
	line-height: 1 !important;
}

/* Hide legacy spacer row */
.row-7 { display: none; }

/* ============================================================
   row-8 (UX poster)
============================================================ */
.row-8 {
	background: var(--bg);
	padding: 60px 24px;
}
.row-8 .row-content {
	max-width: 1320px;
	background: transparent;
}
.row-8 .col-1, .row-8 .col-1 .block-1 { padding: 0; width: 100%; }
.row-8 .col-1 .block-1 {
	border-radius: var(--radius-lg);
	overflow: hidden;
	border: 1px solid var(--border);
	max-width: 1200px;
	margin: 0 auto;
}
.row-8 .col-1 .block-1 img { width: 100%; max-width: 100% !important; }

.row-10 { display: none; }

/* ============================================================
   FOOTER (row-11)
============================================================ */
.row-11 {
	background: var(--bg-2);
	border-top: 1px solid var(--border);
	padding: 80px 24px 40px;
	background-image: none;
}
.row-11 .row-content {
	max-width: 1320px;
	gap: 60px;
	background: transparent !important;
	background-image: none !important;
	align-items: flex-start;
}
.row-11 .col-1, .row-11 .col-2 {
	padding: 0;
	flex: 1 1 50%;
